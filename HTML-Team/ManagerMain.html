<!DOCTYPE html>
<html lang="en">
<head>
  <title>TA Management</title>

  <!-- this is for importing icons like the profile icon and calendar one -->
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS-Team/MainPagesStyle.css"> 
  <script src="../JS-Team/MainPagesScript.js" defer></script>
</head>


<body>
<div class="app-wrap">
  <div class="app-inner">
    <main class="main">
      <nav id="drawer" class="drawer drawer-rail">
        <div class="drawer-content">
          <div class="nav-item">
            <div class="nav-prepend">
              <img src="../Resources/logo copy.png" alt="Logo" class="logo">
            </div>
            <div>
              <button class="drawer-toggle-btn" onclick="toggleDrawer()">
                <i class="mdi mdi-chevron-right"></i>
              </button>
            </div>
          </div>

          <div class="only-full">
            <div class="divider"></div>
            <a class="nav-item" href="/student/profile"> <!-- Add connection to profile here -->
              <div class="nav-prepend"><i class="mdi mdi-account-circle"></i></div>
              <div><div>Profile</div></div>
            </a>
            <a class="nav-item logout" href="/logout"> <!-- Takes you to the login page and puts a popup screen says "successfully logged out" -->
              <div class="nav-prepend"><i class="mdi mdi-logout"></i></div>
              <div><div>Log Out</div></div>
            </a>
          </div>
        </div>
      </nav>

      <div id="main-content" class="main-content">
        <div class="page-header">
          <h2>TA Management</h2>
        </div>
        <ul class="breadcrumbs">
          <li><a href="/">Manager Panel</a></li>  <!-- add refence page check with salama if needed-->
        </ul>
        <hr class="divider divider-bottom-margin">

        <div class="cards">
          <div class="card">
            <div class="card-title">
              <div class="d-col">
                <p class="text-lg">Create Course</p>
                <p class="text-sub">College of Engineering</p>
              </div>
              <div class="status-indicator">
                <i class="mdi mdi-clock status-icon"></i>
                <p class="text-xs">Up to Date</p>
              </div>
            </div>
            <div class="tags">
              <div class="tag">Bachelor of Software Engineering</div>
              <div class="tag-purple">
                <i class="mdi mdi-account-outline icon-purple"></i>
                <span>34 Applicants</span>
              </div>
            </div>
            <div class="card-footer">
              <div class="date-container">
                <i class="mdi mdi-calendar-range calendar-icon"></i>
                <p class="text-xs date-text">Valid Until: 2025-05-30</p>
              </div>
              <button class="btn-details">Details</button>
            </div>
          </div>

          <div class="card">
            <div class="card-title">
              <div class="d-col">
                <p class="text-lg">Assign TA</p>
                <p class="text-sub">College of Engineering</p>
              </div>
              <div class="status-indicator">
                <i class="mdi mdi-clock status-icon"></i>
                <p class="text-xs">Up to Date</p>
              </div>
            </div>
            <div class="tags">
              <div class="tag">Bachelor of Software Engineering</div>
              <div class="tag-purple">
                <i class="mdi mdi-account-outline icon-purple"></i>
                <span>36 Applicants</span>
              </div>
            </div>
            <div class="card-footer">
              <div class="date-container">
                <i class="mdi mdi-calendar-range calendar-icon"></i>
                <p class="text-xs date-text">Valid Until: 2025-05-30</p>
              </div>
              <button class="btn-details">Details</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
