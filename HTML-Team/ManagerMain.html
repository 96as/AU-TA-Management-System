<!DOCTYPE html>
<html lang="en">
<head>
  <title>TA Management</title>
</head>
<body>
<div class="app-wrap">
  <div class="app-inner">
    <main class="main">
      <nav id="drawer" class="drawer drawer-rail">
        <div class="drawer-content">
          <div class="nav-item">
            <div class="nav-prepend">
              <img src="img/logo.8f8d722a.png" alt="Logo" class="logo">
            </div>
            <div>
              <button class="drawer-toggle-btn" onclick="toggleDrawer()">
                <i class="mdi mdi-chevron-right"></i>
              </button>
            </div>
          </div>

          <div class="only-full">
            <div class="divider"></div>
            <a class="nav-item" href="/student/profile">
              <div class="nav-prepend"><i class="mdi mdi-account-circle"></i></div>
              <div><div>Profile</div></div>
            </a>
            <a class="nav-item logout" href="/logout">
              <div class="nav-prepend"><i class="mdi mdi-logout"></i></div>
              <div><div>Log Out</div></div>
            </a>
          </div>
        </div>
      </nav>

      <div id="main-content" class="main-content">
        <div class="page-header">
          <h2>TA Management</h2>
        </div>
        <ul class="breadcrumbs">
          <li><a href="/">Manager Panel</a></li>
        </ul>
        <hr class="divider">

        <div class="cards">
          <div class="card">
            <div class="card-title">
              <div class="d-col">
                <p class="text-lg">Create Course</p>
                <p class="text-sub">College of Engineering</p>
              </div>
              <div class="status">
                <i class="mdi mdi-clock"></i>
                <p class="text-xs">Up to Date</p>
              </div>
            </div>
            <div class="tags">
              <div class="tag">Bachelor of Software Engineering</div>
              <div class="tag-purple">
                <i class="mdi mdi-account-outline icon-purple"></i>
                <span>34 Applicants</span>
              </div>
            </div>
            <div class="card-footer">
              <div class="validity">
                <i class="mdi mdi-calendar-range"></i>
                <p class="text-xs">Valid Until: 2025-05-30</p>
              </div>
              <button class="btn-details">Details</button>
            </div>
          </div>

          <div class="card">
            <div class="card-title">
              <div class="d-col">
                <p class="text-lg">Assign TA</p>
                <p class="text-sub">College of Engineering</p>
              </div>
              <div class="status">
                <i class="mdi mdi-clock"></i>
                <p class="text-xs">Up to Date</p>
              </div>
            </div>
            <div class="tags">
              <div class="tag">Bachelor of Software Engineering</div>
              <div class="tag-purple">
                <i class="mdi mdi-account-outline icon-purple"></i>
                <span>36 Applicants</span>
              </div>
            </div>
            <div class="card-footer">
              <div class="validity">
                <i class="mdi mdi-calendar-range"></i>
                <p class="text-xs">Valid Until: 2025-05-30</p>
              </div>
              <button class="btn-details">Details</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
