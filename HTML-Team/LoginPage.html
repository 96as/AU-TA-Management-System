<!DOCTYPE html>
<html>
<head>
<style>
#signin {
  width: 300px;
  margin: 100px auto;
  padding: 20px;
  background-color: #f5f5f5;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  animation-name: fadeInDown;
  animation-duration: 1s;
  animation-fill-mode: both;
}

@keyframes fadeInDown {
  0% {
    opacity: 0;
    transform: translateY(-20px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

#logo {
  width: 100px;
  height: auto;
  margin-bottom: 20px;
}

#signinBox {
  padding: 20px;
  background-color: #fff;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

#title {
  text-align: center;
  margin-bottom: 20px;
}

#btn-signin {
  width: 100%;
  background-color: #007bff;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 5px;
  cursor: pointer;
}

#btn-signin:hover {
  background-color: #0056b3;
}

#signin .form-group {
  margin-bottom: 15px;
}

.input-wrapper {
  display: flex;
  align-items: center;
  border: 1px solid #ccc;
  border-radius: 5px;
  background-color: white;
  padding: 5px 10px;
}

.input-icon {
  font-size: 16px;
  color: #888;
  padding-right: 10px;
  border-right: 1px solid #ccc;
  margin-right: 10px;
  min-width: 20px;
  text-align: center;
}

.input-wrapper input {
  border: none;
  outline: none;
  flex: 1;
  padding: 10px 5px;
  font-size: 14px;
}

.input-wrapper input:focus {
  box-shadow: none;
}

.container {
  justify-content: center;
  align-items: center;
}
</style>
</head>
<body id="signin">
  <main>
    <div id="app">
      <div class="container">
        <div id="signinBox">
          <div class="row">
            <img src="https://eforms.alfaisal.edu/images/logo.png" id="logo" class="img-fluid mx-auto d-block"/>
            <div>
              <h3 id="title">TA Management System</h3>
              <form method="POST" action="https://eforms.alfaisal.edu/login">
                <div class="form-group row">
                  <div class="input-wrapper">
                    <span class="input-icon">&#128100;</span> <!-- 👤 icon -->
                    <input id="username" type="text" name="username" required autocomplete="username" placeholder="Your Alfaisal email ID.">
                  </div>
                </div>

                <div class="form-group row">
                  <div class="input-wrapper">
                    <span class="input-icon">&#128274;</span> <!-- 🔒 icon -->
                    <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="Your Alfaisal email password.">
                  </div>
                </div>

                <div class="form-group row">
                  <div style="margin-top: 10px;">
                    <button type="submit" class="btn" id="btn-signin">
                      Sign In
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
